name: Source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests and both bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Select the declared npm version
        run: npm install --global npm@11.19.1
      - run: npm ci
      - name: Validate public catalogue and generated usage notes
        run: |
          python3 ../fw/scripts/amiibo_db_validate.py
          python3 ../fw/scripts/amiibo_usage_export.py --check
          python3 tests/test_figure_usage_export.py
      - name: Compare game notes with their published wording
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          gh api --method GET -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/web/src/data/figure-usage.json" -f "ref=$BASE_SHA" > "$RUNNER_TEMP/published-game-notes.json"
          python3 ../fw/scripts/amiibo_usage_export.py --check --reference "$RUNNER_TEMP/published-game-notes.json"
      - run: npm test
      - run: npm run build
      - run: npm run build:pages
      - name: Exercise portable launcher including POSIX shutdown
        run: python3 -B tests/test_windows_launcher_r2.py

  windows-launcher:
    name: Windows portable launcher
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
      - name: Check Windows port ownership, restart and shutdown
        run: python -B tests/test_windows_launcher_r2.py
      - name: Exercise the Windows PowerShell launchers
        run: node --test tests/launcher.test.cjs

  firmware-host:
    name: Portable firmware regression subset
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show host toolchain
        run: |
          python3 --version
          gcc --version
      - name: Production CRC pair and independent oracles
        run: python3 fw/tests/de3/test_packed_crc_pair_de355.py
      - name: LittleFS NOR wear and interrupted writes
        run: python3 fw/tests/de3/test_lfs_wear_de355.py
      - name: LCD keyboard pixels, input and scrollbar boundaries
        run: python3 fw/tests/de3/test_ui_comfort_de356.py
      - name: Check static settings rows with the production font
        run: python3 fw/tests/de3/test_settings_label_width_de361.py
      - name: Existing LCD editor rendering
        run: python3 fw/tests/de3/test_text_input_render_de344.py
      - name: LCD photo pixels and file digest protocol
        run: |
          python3 fw/tests/de3/test_display_photo.py
          python3 fw/tests/de3/test_packed_recovery_protocol.py
      - name: Bluetooth status lifecycle and LCD pixels
        run: python3 fw/tests/de3/test_ble_status_de357.py
      - name: Kirby v3 rider and machine responses
        run: python3 fw/tests/de3/test_kirby_v3_machines.py
      - name: Card slot storage failures, ordinary exits and controlled reset
        run: |
          python3 fw/tests/de3/test_chameleon_state_load.py
          python3 fw/tests/de3/test_chameleon_exit_guard.py
          python3 fw/tests/de3/test_exit_contract_de358.py
          python3 fw/tests/de3/test_reset_exit_contract_de358.py
