name: Unsigned LCD application and bootloader builds

# The reviewed App646 has its own fixed binary identity. Main verifies the published release.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths: ['fw/**', 'tools/**', 'RELEASE_INFO.json', 'web/public/firmware/*.zip', 'bootloader-bl8/fw/bootloader/src/dfu_public_key.c', 'bootloader-z17/**', 'bootloader-z19/**', '.github/workflows/unsigned-firmware.yml']
  push:
    branches: [main, fix/de372-review-nov13]
    tags: [de3.73-test646]
    paths: ['fw/**', 'tools/**', 'RELEASE_INFO.json', 'web/public/firmware/*.zip', 'bootloader-bl8/fw/bootloader/src/dfu_public_key.c', 'bootloader-z17/**', 'bootloader-z19/**', '.github/workflows/unsigned-firmware.yml']

permissions:
  contents: read

jobs:
  application:
    name: ${{ github.event_name == 'pull_request' && 'LCD application (pull request)' || ((github.ref == 'refs/heads/fix/de372-review-nov13' || github.ref == 'refs/tags/de3.73-test646') && 'DE3.73 App646 application' || 'DE3.72 application') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONOPTIMIZE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      SDK_IMAGE: solosky/nrf52-sdk@sha256:ef337de9a0504dc3cf0f94a0a8d09f06193b318b3cc9b1bc5bd0b92a7bc1ea16
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch pinned external SDK and ARM toolchain
        run: docker pull "$SDK_IMAGE"
      - name: Exercise linker budget gates
        run: python3 fw/tests/de3/test_application_budget.py
      - name: Select the build identity and evidence directory
        id: identity
        env:
          APP646_REF: ${{ github.ref == 'refs/heads/fix/de372-review-nov13' || github.ref == 'refs/tags/de3.73-test646' || github.head_ref == 'fix/de372-review-nov13' || github.base_ref == 'fix/de372-review-nov13' }}
        shell: bash
        run: |
          mode=release
          dir=build/lcd-de372
          if [[ "$APP646_REF" == true ]] || { [[ "$GITHUB_EVENT_NAME" == pull_request ]] && grep -Fxq '#define VERSION "2.22.0-DE3.73"' fw/application/src/version.inc.h; }; then
            mode=development
            dir=build/lcd-de373
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            mode=candidate
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Compile unsigned LCD and inspect actual flash and RAM reserves
        env:
          BUILD_MODE: ${{ steps.identity.outputs.mode }}
          BUILD_DIR: ${{ steps.identity.outputs.dir }}
        shell: bash
        run: |
          args=(--mode "$BUILD_MODE" --output "$BUILD_DIR" --jobs 4)
          if [[ "$BUILD_MODE" == development ]]; then
            args+=(--version 2.22.0-DE3.73 --counter 646 --stack-report)
          fi
          python3 tools/build_lcd.py "${args[@]}"
          if [[ "$BUILD_MODE" == development ]]; then
            echo "5d8937db3482c777cd9f768bf15ecedf909adff9dd094446809faa0a3a045ddb  $BUILD_DIR/pixljs.bin" | sha256sum --check --strict -
          fi
      - name: Install the pinned Cortex-M4 emulator and SDK test inputs
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/stack-venv"
          "$RUNNER_TEMP/stack-venv/bin/pip" install --only-binary=:all: --no-deps --require-hashes -r tools/ci-unicorn-linux-x64.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi python3-cryptography
          mkdir -p "$RUNNER_TEMP/sdk-test"
          docker run --rm --network none --entrypoint sh "$SDK_IMAGE" -ec '
            tar -C "$NRF52_SDK_ROOT" -cf - components/ble/nrf_ble_gatt/nrf_ble_gatt.c components/softdevice/s112/hex/s112_nrf52_7.2.0_softdevice.hex
          ' | tar -C "$RUNNER_TEMP/sdk-test" -xf -
      - name: Verify the packaged application against the release build and bound Z19 key
        if: steps.identity.outputs.mode == 'release'
        run: /usr/bin/python3 tools/check_release_ota.py
      - name: Exercise every DE2 and DE3 host suite
        env:
          NRF52_SDK_ROOT: ${{ runner.temp }}/sdk-test
          BUILD_DIR: ${{ steps.identity.outputs.dir }}
        run: |
          python3 -B fw/tests/de3/run_all.py --minimum-suites "$(jq -er .host_firmware_suites RELEASE_INFO.json)" --report "$BUILD_DIR/FIRMWARE_TESTS.json"
      - name: Execute stack and PXDG checks on this build's Cortex-M4 ELF
        env:
          BUILD_DIR: ${{ steps.identity.outputs.dir }}
        shell: bash
        run: |
          "$RUNNER_TEMP/stack-venv/bin/python" fw/tests/de3/check_stack_watermark_elf.py "$BUILD_DIR/pixljs.out" | tee "$BUILD_DIR/STACK_ELF.txt"
          "$RUNNER_TEMP/stack-venv/bin/python" fw/tests/de3/check_first_menu_elf.py "$BUILD_DIR/pixljs.out" "$BUILD_DIR/pixljs.bin" | tee "$BUILD_DIR/FIRST_MENU_ELF.txt"
          cat "$BUILD_DIR/BUILD_RESULT.json"
      - name: Archive the actual build and test results
        if: (success() || failure()) && steps.identity.outputs.dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcd-firmware-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.identity.outputs.dir }}/
          if-no-files-found: error
          retention-days: 30

  bootloader:
    name: BL8 corresponding-source build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bootloader-bl8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch pinned external SDK and ARM toolchain
        run: docker pull solosky/nrf52-sdk@sha256:ef337de9a0504dc3cf0f94a0a8d09f06193b318b3cc9b1bc5bd0b92a7bc1ea16
      - name: Verify BL8 source binding
        run: python3 build.py --check
      - name: Compile and verify unsigned BL8 offline
        run: python3 build.py

  bootloader-current-and-previous:
    name: ${{ matrix.boot }} source-bound build and ARM tests
    strategy:
      fail-fast: false
      matrix:
        boot: [z17, z19]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bootloader-${{ matrix.boot }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the Z19 test input hashes
        if: matrix.boot == 'z19'
        run: jq -er '.files | to_entries[] | .value + "  " + .key' TEST_BINDING.json | sha256sum --check --strict -
      - name: Fetch the pinned SDK and compile the bound unsigned bootloader
        run: |
          docker pull solosky/nrf52-sdk@sha256:ef337de9a0504dc3cf0f94a0a8d09f06193b318b3cc9b1bc5bd0b92a7bc1ea16
          python3 build.py --check
          python3 build.py
      - name: Prepare the pinned ARM emulator
        run: |
          python3 -m venv "$RUNNER_TEMP/boot-venv"
          "$RUNNER_TEMP/boot-venv/bin/pip" install --only-binary=:all: --no-deps --require-hashes -r ../tools/ci-unicorn-linux-x64.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi
      - name: Run source-bound reset, session, LCD and ARM crypto tests
        run: '"$RUNNER_TEMP/boot-venv/bin/python" tests/run_offline.py --output _checks'
      - name: Check offline runner and resume the released application in the Z19 transfer model
        if: matrix.boot == 'z19'
        shell: bash
        run: |
          python3 -B tests/test_runner_modes.py
          python3 -B tests/test_app_stream_modes.py
          ota="../$(jq -er .application_ota_path ../RELEASE_INFO.json)"
          python3 -B tests/DFU_Stream/check_app_stream.py --app-only "$ota" --output _checks/application-resume.json
      - name: Archive bootloader evidence
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.boot }}-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            bootloader-${{ matrix.boot }}/_build/
            bootloader-${{ matrix.boot }}/_checks/
          if-no-files-found: error
          retention-days: 30
