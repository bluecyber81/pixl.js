name: Unsigned LCD application and bootloader builds

# Rebuild the released LCD application and test it against the signed bytes.
# The Z19 model resumes both the current and the previous signed LCD app ZIP.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths: ['fw/**', 'tools/**', 'RELEASE_INFO.json', 'web/public/firmware/*.zip', 'bootloader-bl8/fw/bootloader/src/dfu_public_key.c', 'bootloader-z17/**', 'bootloader-z19/**', 'bootloader-z20/**', 'bootloader-z21/**', '.github/workflows/unsigned-firmware.yml']
  push:
    branches: [main, 'release/lcd-*']
    paths: ['fw/**', 'tools/**', 'RELEASE_INFO.json', 'web/public/firmware/*.zip', 'bootloader-bl8/fw/bootloader/src/dfu_public_key.c', 'bootloader-z17/**', 'bootloader-z19/**', 'bootloader-z20/**', 'bootloader-z21/**', '.github/workflows/unsigned-firmware.yml']

permissions:
  contents: read

jobs:
  application:
    name: LCD application build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONOPTIMIZE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      SDK_IMAGE: solosky/nrf52-sdk@sha256:ef337de9a0504dc3cf0f94a0a8d09f06193b318b3cc9b1bc5bd0b92a7bc1ea16
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine the required application check
        id: application_mode
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mode=release
          if jq -e '.firmware_preview' RELEASE_INFO.json >/dev/null; then mode=preview; fi
          if [ -n "$BASE_SHA" ] && git diff --quiet "$BASE_SHA" HEAD -- RELEASE_INFO.json fw/releases web/public/firmware; then
            mode=candidate
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Fetch pinned external SDK and ARM toolchain
        run: docker pull "$SDK_IMAGE"
      - name: Exercise linker budget gates
        run: python3 fw/tests/de3/test_application_budget.py
      - name: Compile unsigned LCD and inspect actual flash and RAM reserves
        env:
          BUILD_MODE: ${{ steps.application_mode.outputs.mode }}
        run: python3 tools/build_lcd.py --mode "$BUILD_MODE" --jobs 4 --output build/lcd-application
      - name: Install the pinned Cortex-M4 emulator and SDK test inputs
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-linux-gnueabihf python3-venv python3-cryptography
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/stack-venv"
          "$RUNNER_TEMP/stack-venv/bin/pip" install --only-binary=:all: --no-deps --require-hashes -r tools/ci-unicorn-linux-x64.txt
          mkdir -p "$RUNNER_TEMP/sdk-test"
          docker run --rm --network none --entrypoint sh "$SDK_IMAGE" -ec '
            tar -C "$NRF52_SDK_ROOT" -cf - \
              components/ble/nrf_ble_gatt/nrf_ble_gatt.c \
              components/ble/common/ble_advdata.c \
              components/ble/common/ble_advdata.h \
              components/softdevice/s112/headers \
              components/softdevice/s112/hex/s112_nrf52_7.2.0_softdevice.hex
          ' | tar -C "$RUNNER_TEMP/sdk-test" -xf -
      - name: Verify the signed package against the compiled application and bound bootloader key
        if: steps.application_mode.outputs.mode != 'candidate'
        env:
          BUILD_MODE: ${{ steps.application_mode.outputs.mode }}
        run: |
          args=(--build-dir build/lcd-application)
          if [ "$BUILD_MODE" = preview ]; then args+=(--preview); fi
          /usr/bin/python3 tools/check_release_ota.py "${args[@]}"
      - name: Resume the verified signed LCD application on the bound Z21 data path
        if: steps.application_mode.outputs.mode != 'candidate'
        run: |
          build="$GITHUB_WORKSPACE/build/lcd-application"
          jq -e '(.firmware_preview.tested_bootloader // .tested_bootloader).source == "bootloader-z21"' RELEASE_INFO.json >/dev/null
          sha=$(jq -er '.images | select(length == 1) | .[0] | select(.type == "application" and .signature_verified == true) | .sha256' "$build/SIGNED_OTA.json")
          python3 -B bootloader-z21/build.py --prepare "$RUNNER_TEMP/z21-preview"
          python3 -B "$RUNNER_TEMP/z21-preview/tests/check_resume.py" "$build/pixljs.bin" "$sha" "$build/Z21_PREVIEW_RESUME.json"
      - name: Verify both Android DFU phases against the release packages
        run: /usr/bin/python3 tools/verify_lcd_combo.py --profile de3.89
      - name: Exercise every DE2 and DE3 host suite
        env:
          NRF52_SDK_ROOT: ${{ runner.temp }}/sdk-test
        run: |
          "$RUNNER_TEMP/stack-venv/bin/python" -B fw/tests/de3/run_all.py --minimum-suites "$(jq -er '.firmware_preview.host_firmware_suites // .host_firmware_suites' RELEASE_INFO.json)" --report build/lcd-application/FIRMWARE_TESTS.json
      - name: Exercise stack, menu, crypto, flash ID and LCD on the linked Cortex-M4 ELF
        shell: bash
        run: |
          "$RUNNER_TEMP/stack-venv/bin/python" fw/tests/de3/check_stack_watermark_elf.py build/lcd-application/pixljs.out | tee build/lcd-application/STACK_ELF.txt
          "$RUNNER_TEMP/stack-venv/bin/python" fw/tests/de3/check_first_menu_elf.py build/lcd-application/pixljs.out build/lcd-application/pixljs.bin | tee build/lcd-application/FIRST_MENU_ELF.txt
          "$RUNNER_TEMP/stack-venv/bin/python" fw/tests/de3/check_aes_m4_elf.py build/lcd-application/pixljs.out build/lcd-application/pixljs.bin | tee build/lcd-application/AES_ELF.txt
          "$RUNNER_TEMP/stack-venv/bin/python" fw/tests/de3/check_flash_jedec_elf.py build/lcd-application/pixljs.out build/lcd-application/pixljs.bin | tee build/lcd-application/FLASH_JEDEC_ELF.txt
          "$RUNNER_TEMP/stack-venv/bin/python" fw/tests/de3/check_display_profile_elf.py build/lcd-application/pixljs.out build/lcd-application/pixljs.bin | tee build/lcd-application/DISPLAY_PROFILE_ELF.txt
          "$RUNNER_TEMP/stack-venv/bin/python" fw/tests/de3/check_lcd_game_rotation_elf.py build/lcd-application --out build/lcd-application/GAME_ROTATION.json
          "$RUNNER_TEMP/stack-venv/bin/python" fw/tests/de3/check_lcd_device_test_elf.py build/lcd-application --out build/lcd-application/LCD_DEVICE_TEST.json --frames build/lcd-application/device-test-frames
          "$RUNNER_TEMP/stack-venv/bin/python" fw/tests/de3/check_build_fault_elf.py build/lcd-application --json build/lcd-application/BUILD_FAULT.json
          cat build/lcd-application/BUILD_RESULT.json
      - name: Archive the actual build and test results
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcd-firmware-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: build/lcd-application/
          if-no-files-found: error
          retention-days: 30

  bootloader:
    name: BL8 corresponding-source build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bootloader-bl8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch pinned external SDK and ARM toolchain
        run: docker pull solosky/nrf52-sdk@sha256:ef337de9a0504dc3cf0f94a0a8d09f06193b318b3cc9b1bc5bd0b92a7bc1ea16
      - name: Verify BL8 source binding
        run: python3 build.py --check
      - name: Compile and verify unsigned BL8 offline
        run: python3 build.py

  bootloader-current-and-previous:
    name: ${{ matrix.boot }} source-bound build and ARM tests
    strategy:
      fail-fast: false
      matrix:
        boot: [z17, z19]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bootloader-${{ matrix.boot }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the Z19 test input hashes
        if: matrix.boot == 'z19'
        run: jq -er '.files | to_entries[] | .value + "  " + .key' TEST_BINDING.json | sha256sum --check --strict -
      - name: Fetch the pinned SDK and compile the bound unsigned bootloader
        run: |
          docker pull solosky/nrf52-sdk@sha256:ef337de9a0504dc3cf0f94a0a8d09f06193b318b3cc9b1bc5bd0b92a7bc1ea16
          python3 build.py --check
          python3 build.py
      - name: Prepare the pinned ARM emulator
        run: |
          python3 -m venv "$RUNNER_TEMP/boot-venv"
          "$RUNNER_TEMP/boot-venv/bin/pip" install --only-binary=:all: --no-deps --require-hashes -r ../tools/ci-unicorn-linux-x64.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi
      - name: Run source-bound reset, session, LCD and ARM crypto tests
        run: '"$RUNNER_TEMP/boot-venv/bin/python" tests/run_offline.py --output _checks'
      - name: Check Z19 runner and all frozen App662 and App654 stream-mode tests
        if: matrix.boot == 'z19'
        shell: bash
        run: |
          python3 -B tests/test_runner_modes.py
          python3 -B ../tools/check_z19_stream_modes.py --output _checks/historical-stream-modes.json
      - name: Resume the hash-bound current LCD release and pinned App654 on Z19
        if: matrix.boot == 'z19'
        shell: bash
        run: |
          python3 -B ../tools/extract_release_application.py --output _checks/current-release.bin --report _checks/current-release-input.json
          current_sha="$(jq -er .applicationSha256 _checks/current-release-input.json)"
          previous="../$(jq -er .previous_lcd_release.application_ota_path ../RELEASE_INFO.json)"
          python3 -B tests/DFU_Stream/check_app_stream.py --test-bin _checks/current-release.bin --expected-sha256 "$current_sha" --output _checks/current-release-resume.json
          python3 -B tests/DFU_Stream/check_app_stream.py --app-only "$previous" --output _checks/application-resume.json
      - name: Archive bootloader evidence
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.boot }}-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            bootloader-${{ matrix.boot }}/_build/
            bootloader-${{ matrix.boot }}/_checks/
          if-no-files-found: error
          retention-days: 30

  bootloader-checkpoints:
    name: ${{ matrix.boot }} source-bound build and DFU recovery tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - boot: z20
            profile: de3.80
          - boot: z21
            profile: de3.89
    env:
      BOOT: ${{ matrix.boot }}
      PROFILE: ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare the bound bootloader sources and reproduce the pinned LCD image
        run: |
          docker pull solosky/nrf52-sdk@sha256:ef337de9a0504dc3cf0f94a0a8d09f06193b318b3cc9b1bc5bd0b92a7bc1ea16
          python3 -B "bootloader-$BOOT/build.py" --prepare "$RUNNER_TEMP/boot-source"
          cd "$RUNNER_TEMP/boot-source"
          python3 -B build.py --check
          python3 -B build.py
      - name: Run the native and ARM checks and resume the signed package
        run: |
          python3 -m venv "$RUNNER_TEMP/boot-venv"
          "$RUNNER_TEMP/boot-venv/bin/pip" install --only-binary=:all: --no-deps --require-hashes -r tools/ci-unicorn-linux-x64.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi python3-cryptography
          proof="$(/usr/bin/python3 tools/verify_lcd_combo.py --profile "$PROFILE")"
          archive="fw/releases/$(jq -er .comboFilename <<< "$proof")"
          app="$(unzip -p "$archive" manifest.json | jq -er .manifest.application.bin_file)"
          system="$(unzip -p "$archive" manifest.json | jq -er .manifest.softdevice_bootloader.bin_file)"
          unzip -p "$archive" "$app" > "$RUNNER_TEMP/application.bin"
          unzip -p "$archive" "$system" > "$RUNNER_TEMP/system.bin"
          cd "$RUNNER_TEMP/boot-source"
          "$RUNNER_TEMP/boot-venv/bin/python" -B tests/run_offline.py --output _checks
          python3 -B tests/check_resume.py "$RUNNER_TEMP/application.bin" "$(jq -er .appSha256 <<< "$proof")" _checks/checkpoint-resume.json
          python3 -B tests/check_resume.py "$RUNNER_TEMP/system.bin" "$(jq -er .systemSha256 <<< "$proof")" _checks/system-checkpoint-resume.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: ${{ matrix.boot }}-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/boot-source/_build/
            ${{ runner.temp }}/boot-source/_checks/
          if-no-files-found: error
          retention-days: 30
